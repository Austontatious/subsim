name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SDL_AUDIODRIVER: dummy
      PYGLET_HEADLESS: "true"
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,hydrophone]"
      - name: Pytest
        run: python -m pytest -q

  replay:
    runs-on: ubuntu-latest
    env:
      SDL_AUDIODRIVER: dummy
      PYGLET_HEADLESS: "true"
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Golden replay
        run: python -m pytest -q tests/test_replay.py
