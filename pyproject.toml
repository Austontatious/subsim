[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "subsim"
version = "0.1.0"
description = "Audio-first submarine skirmish prototype."
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "SubSim Team"}]
license = "MIT"
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
]
dependencies = [
  "pyglet>=2.0.8",
  "pygame>=2.5.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
]
hydrophone = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "soundfile>=0.12",
  "scikit-learn>=1.3",
  "matplotlib>=3.7",
  "requests>=2.31",
  "pyarrow>=15.0",
]

[project.scripts]
subsim = "subsim.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["subsim", "subsim.*"]
exclude = ["core", "desktop", "godot", "assets", "tests"]
